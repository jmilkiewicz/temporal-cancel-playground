# Manual dev setup only — `npm test` does not use this.
services:
  temporal:
    image: temporalio/temporal:1.9.1
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--headless"]
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:2.55.0
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8080:8080"
